[package]
name = "test_login_page"
version = "0.1.0"
authors = ["Alexandre Aksenov <alexander1aksenov@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["fullstack", "router"] }
# https://dioxuslabs.com/learn/0.7/essentials/router/#installing-the-router
# "fullstack" requires: tokio-tungstenite = "^0.29.0"  , axum = "^0.8.4"
# ->
tokio-tungstenite = { version = "0.30.0", optional = true }
axum = { version = "0.8.9", optional = true }

# To prevent server status 500:
tokio = { version = "1.53.1", features = ["full"], optional = true }

tokio-postgres = { version = "0.7.13", optional = true }

# For hashing the password:
sha3-rust = "0.1.1"
hex = "0.4.3"


# For storing login info so that it persists page reload:
dioxus-sdk-storage = "0.7.0"
# Call as: dioxus_sdk_storage::use_persistent;

# See: https://docs.rs/dioxus-sdk-storage/latest/dioxus_sdk_storage/

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# new for fullstack:
server = ["dioxus/server", "dep:axum", "dep:tokio-tungstenite", "dep:tokio-postgres", "dep:tokio"]
