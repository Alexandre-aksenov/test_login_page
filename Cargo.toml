[package]
name = "test_login_page"
version = "0.1.0"
authors = ["Alexandre Aksenov <alexander1aksenov@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
# https://dioxuslabs.com/learn/0.7/essentials/router/#installing-the-router

# For managing accounts
postgres = { version = "0.19.13"}
sha3-rust = "0.1.1"
hex = "0.4.3"


[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
