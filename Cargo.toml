[package]
name = "test_login_page"
version = "0.1.0"
authors = ["Alexandre Aksenov <alexander1aksenov@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["fullstack", "router"] }
# https://dioxuslabs.com/learn/0.7/essentials/router/#installing-the-router
# "fullstack" requires: tokio-tungstenite = "^0.29.0"  , axum = "^0.8.4"
# ->
tokio-tungstenite = { version = "0.30.0", optional = true }
axum = { version = "0.8.9", optional = true }

# Try to prevent server status 500:
tokio = { version = "1.53.1", features = ["full"], optional = true }

postgres = { version = "0.19.13", optional = true }

# For hashing the password:
sha3-rust = "0.1.1"
hex = "0.4.3"

# For storing connection data in an accessile way to all pages
# dioxus-shareables = "0.3.0"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# new for fullstack:
server = ["dioxus/server", "dep:axum", "dep:tokio-tungstenite", "dep:postgres", "dep:tokio"]
